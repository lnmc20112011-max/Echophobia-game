<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Echo-Phobia: Ám Ảnh Tiếng Vang</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* MÀN HÌNH LOADING BAN ĐẦU */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .welcome-text {
            font-size: 24px;
            color: #00ffcc;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
            text-align: center;
            padding: 0 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #00ffcc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* KHU VỰC GAME */
        h2 { margin: 5px 0; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.5); font-size: 20px; }
        
        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4/3;
        }
        canvas {
            width: 100%;
            height: 100%;
            background-color: #000;
            border: 2px solid #333;
        }
        #instructions {
            margin-top: 5px;
            text-align: center;
            max-width: 800px;
            font-size: 12px;
            color: #666;
            padding: 0 10px;
        }
        .highlight { color: #00ffcc; font-weight: bold; }

        /* HỆ THỐNG NÚT BẤM ĐIỆN THOẠI (D-PAD) */
        #mobile-controls {
            display: none; /* Mặc định ẩn trên máy tính */
            width: 100%;
            max-width: 400px;
            margin-top: 15px;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 5px;
        }
        .btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            touch-action: none;
        }
        .btn:active {
            background: rgba(0, 255, 204, 0.4);
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-action {
            width: 90px;
            height: 45px;
            font-size: 14px;
        }
        
        /* Hiện nút bấm khi ở chế độ mobile/cảm ứng */
        @media (max-width: 768px) {
            #mobile-controls { display: flex; }
            #instructions { display: none; } /* Ẩn hướng dẫn bàn phím trên đt */
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="welcome-text">Chào mừng bạn đến với website của cuongdz 😎</div>
        <div class="spinner"></div>
    </div>

    <h2>ECHO-PHOBIA</h2>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    
    <div id="instructions">
        Di chuyển: <span class="highlight">WASD/Mũi Tên</span> (Giữ <span class="highlight">Shift</span> đi rón rén) | Ping: <span class="highlight">Click chuột</span> vào màn hình.
    </div>

    <div id="mobile-controls">
        <div class="d-pad">
            <div></div><div class="btn" id="btn-up">▲</div><div></div>
            <div class="btn" id="btn-left">◀</div><div></div><div class="btn" id="btn-right">▶</div>
            <div></div><div class="btn" id="btn-down">▼</div><div></div>
        </div>
        <div class="action-buttons">
            <div class="btn btn-action" id="btn-ping">🔊 PING</div>
            <div class="btn btn-action" id="btn-sneak" style="border-color: #ffcc00; color: #ffcc00;">👟 CHẠY</div>
        </div>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 1. XỬ LÝ MÀN HÌNH LOADING 2 GIÂY
window.addEventListener("load", () => {
    setTimeout(() => {
        const loader = document.getElementById("loading-screen");
        loader.style.opacity = 0;
        setTimeout(() => loader.style.display = "none", 500);
    }, 2000); // 2000ms = 2 giây
});

// Trạng thái game
let gameRunning = true;
let win = false;

// Người chơi
const player = { x: 50, y: 50, radius: 8, speed: 3, color: "#00ffcc" };
const goal = { x: 750, y: 550, radius: 15, color: "#ffff00" };

// Điều khiển
const keys = {};
let touchMovement = { up: false, down: false, left: false, right: false };
let isSneaking = false; // Mặc định Mobile là chạy, bấm nút sẽ chuyển thành rón rén

window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

// Thiết lập bản đồ & kẻ địch
const walls = [
    {x: 0, y: 0, w: 800, h: 10}, {x: 0, y: 0, w: 10, h: 600},
    {x: 0, y: 590, w: 800, h: 10}, {x: 790, y: 0, w: 10, h: 600},
    {x: 150, y: 0, w: 30, h: 400}, {x: 300, y: 200, w: 30, h: 400},
    {x: 450, y: 0, w: 30, h: 350}, {x: 600, y: 250, w: 30, h: 350}, {x: 450, y: 450, w: 150, h: 30}
];
walls.forEach(w => w.opacity = 0);

const enemies = [
    { x: 220, y: 150, targetX: 220, targetY: 150, state: "patrol", speed: 1.5, angle: 0, patrolYStart: 100, patrolYEnd: 500, dir: 1, opacity: 0 },
    { x: 380, y: 450, targetX: 380, targetY: 450, state: "patrol", speed: 1.5, angle: 0, patrolYStart: 100, patrolYEnd: 500, dir: -1, opacity: 0 },
    { x: 530, y: 200, targetX: 530, targetY: 200, state: "patrol", speed: 1.5, angle: 0, patrolYStart: 50, patrolYEnd: 400, dir: 1, opacity: 0 },
    { x: 700, y: 400, targetX: 700, targetY: 400, state: "patrol", speed: 1.8, angle: 0, patrolYStart: 100, patrolYEnd: 500, dir: -1, opacity: 0 }
];

const pings = [];

// Hàm kích hoạt phát sóng âm (Dùng chung PC & Mobile)
function triggerPing(targetX, targetY) {
    if (!gameRunning) { resetGame(); return; }
    const angle = Math.atan2(targetY - player.y, targetX - player.x);
    pings.push({ x: player.x, y: player.y, radius: 5, maxRadius: 250, speed: 7, angle: angle, type: "ping" });
    enemies.forEach(enemy => {
        if (Math.hypot(enemy.x - player.x, enemy.y - player.y) < 250) {
            enemy.state = "chase"; enemy.targetX = player.x; enemy.targetY = player.y;
        }
    });
}

// Click trên Máy tính
canvas.addEventListener("mousedown", (e) => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = ((e.clientX - rect.left) / rect.width) * 800;
    const mouseY = ((e.clientY - rect.top) / rect.height) * 600;
    triggerPing(mouseX, mouseY);
});

// Chạm màn hình Game trên Điện thoại để tự động Ping về hướng đó
canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    const touchX = ((touch.clientX - rect.left) / rect.width) * 800;
    const touchY = ((touch.clientY - rect.top) / rect.height) * 600;
    triggerPing(touchX, touchY);
});

// 2. TÍCH HỢP ĐIỀU KHIỂN NÚT BẤM ẢO TRÊN MOBILE
const setupMobileBtn = (id, direction) => {
    const btn = document.getElementById(id);
    btn.addEventListener("touchstart", (e) => { e.preventDefault(); touchMovement[direction] = true; });
    btn.addEventListener("touchend", (e) => { e.preventDefault(); touchMovement[direction] = false; });
};
setupMobileBtn("btn-up", "up");
setupMobileBtn("btn-down", "down");
setupMobileBtn("btn-left", "left");
setupMobileBtn("btn-right", "right");

// Nút bấm Ping riêng trên Mobile (Phát xung quanh)
document.getElementById("btn-ping").addEventListener("touchstart", (e) => {
    e.preventDefault();
    triggerPing(player.x + 10, player.y);
});

// Nút Bấm Đi rón rén / Chạy trên Mobile
const sneakBtn = document.getElementById("btn-sneak");
sneakBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    isSneaking = !isSneaking;
    if (isSneaking) {
        sneakBtn.textContent = "👣 LẶNG";
        sneakBtn.style.borderColor = "#00ffcc";
        sneakBtn.style.color = "#00ffcc";
    } else {
        sneakBtn.textContent = "👟 CHẠY";
        sneakBtn.style.borderColor = "#ffcc00";
        sneakBtn.style.color = "#ffcc00";
    }
});

function resetGame() {
    player.x = 50; player.y = 50;
    enemies.forEach((e, idx) => {
        e.x = [220, 380, 530, 700][idx]; e.y = [150, 450, 200, 400][idx];
        e.targetX = e.x; e.targetY = e.y; e.state = "patrol"; e.opacity = 0;
    });
    pings.length = 0; walls.forEach(w => w.opacity = 0);
    gameRunning = true; win = false;
}

function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
function checkCollision(circle, rect) {
    const closestX = clamp(circle.x, rect.x, rect.x + rect.w);
    const closestY = clamp(circle.y, rect.y, rect.y + rect.h);
    return (circle.x - closestX)**2 + (circle.y - closestY)**2 < circle.radius**2;
}

function update() {
    if (!gameRunning) return;

    // Tính toán tốc độ (PC nhận Shift, Mobile nhận trạng thái nút Đi Lặng)
    let moveSpeed = player.speed;
    let sneakActive = keys["ShiftLeft"] || keys["ShiftRight"] || isSneaking;
    if (sneakActive) moveSpeed = 1.2;

    let nextX = player.x;
    let nextY = player.y;
    let isMoving = false;

    // Đọc lệnh từ cả bàn phím và nút bấm ảo mobile
    if (keys["KeyW"] || keys["ArrowUp"] || touchMovement.up) { nextY -= moveSpeed; isMoving = true; }
    if (keys["KeyS"] || keys["ArrowDown"] || touchMovement.down) { nextY += moveSpeed; isMoving = true; }
    if (keys["KeyA"] || keys["ArrowLeft"] || touchMovement.left) { nextX -= moveSpeed; isMoving = true; }
    if (keys["KeyD"] || keys["ArrowRight"] || touchMovement.right) { nextX += moveSpeed; isMoving = true; }

    const tempPlayerX = { x: nextX, y: player.y, radius: player.radius };
    let collideX = false;
    for (let wall of walls) { if (checkCollision(tempPlayerX, wall)) { collideX = true; break; } }
    if (!collideX) player.x = nextX;

    const tempPlayerY = { x: player.x, y: nextY, radius: player.radius };
    let collideY = false;
    for (let wall of walls) { if (checkCollision(tempPlayerY, wall)) { collideY = true; break; } }
    if (!collideY) player.y = nextY;

    // Sóng âm bước chân khi chạy nhanh
    if (isMoving && !sneakActive && Math.random() < 0.05) {
        pings.push({ x: player.x, y: player.y, radius: 5, maxRadius: 60, speed: 3, type: "step" });
        enemies.forEach(enemy => {
            if (Math.hypot(enemy.x - player.x, enemy.y - player.y) < 80) {
                enemy.state = "chase"; enemy.targetX = player.x; enemy.targetY = player.y;
            }
        });
    }

    // Xử lý các vòng sóng Ping
    for (let i = pings.length - 1; i >= 0; i--) {
        const p = pings[i]; p.radius += p.speed;
        walls.forEach(wall => {
            if (Math.abs(Math.hypot(p.x - (wall.x + wall.w/2), p.y - (wall.y + wall.h/2)) - p.radius) < 30) wall.opacity = 1.0;
        });
        enemies.forEach(enemy => {
            if (Math.abs(Math.hypot(p.x - enemy.x, p.y - enemy.y) - p.radius) < 20) enemy.opacity = 1.0;
        });
        if (p.radius >= p.maxRadius) pings.splice(i, 1);
    }

    walls.forEach(w => { if (w.opacity > 0) w.opacity -= 0.012; });
    enemies.forEach(e => { if (e.opacity > 0) e.opacity -= 0.015; });

    // Cập nhật AI Kẻ địch
    enemies.forEach(enemy => {
        if (enemy.state === "patrol") {
            enemy.y += enemy.speed * enemy.dir;
            if (enemy.y > enemy.patrolYEnd || enemy.y < enemy.patrolYStart) enemy.dir *= -1;
            enemy.targetX = enemy.x; enemy.targetY = enemy.y;
            enemy.angle = enemy.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
        } else if (enemy.state === "chase") {
            const angle = Math.atan2(enemy.targetY - enemy.y, enemy.targetX - enemy.x);
            enemy.angle = angle;
            enemy.x += Math.cos(angle) * (enemy.speed * 1.5);
            enemy.y += Math.sin(angle) * (enemy.speed * 1.5);
            if (Math.hypot(enemy.targetX - enemy.x, enemy.targetY - enemy.y) < 10) enemy.state = "patrol";
        }

        if (Math.hypot(player.x - enemy.x, player.y - enemy.y) < (player.radius + 8)) {
            gameRunning = false; win = false;
        }
    });

    if (Math.hypot(player.x - goal.x, player.y - goal.y) < (player.radius + goal.radius)) {
        gameRunning = false; win = true;
    }
}

function draw() {
    ctx.fillStyle = "#000000"; ctx.fillRect(0, 0, canvas.width, canvas.height);

    walls.forEach(wall => {
        if (wall.opacity > 0) {
            ctx.shadowBlur = 15; ctx.shadowColor = `rgba(0, 255, 204, ${wall.opacity})`;
            ctx.strokeStyle = `rgba(0, 255, 204, ${wall.opacity})`; ctx.lineWidth = 2;
            ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
            ctx.fillStyle = `rgba(0, 255, 204, ${wall.opacity * 0.1})`; ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
        }
    });
    ctx.shadowBlur = 0;

    ctx.beginPath(); ctx.arc(goal.x, goal.y, goal.radius, 0, Math.PI * 2);
    ctx.shadowBlur = 10; ctx.shadowColor = goal.color; ctx.fillStyle = goal.color; ctx.fill(); ctx.closePath(); ctx.shadowBlur = 0;

    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = player.color; ctx.shadowBlur = 12; ctx.shadowColor = player.color; ctx.fill(); ctx.closePath(); ctx.shadowBlur = 0;

    pings.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        const alpha = 1 - (p.radius / p.maxRadius);
        ctx.strokeStyle = p.type === "ping" ? `rgba(0, 255, 204, ${alpha})` : `rgba(255, 255, 255, ${alpha * 0.5})`;
        ctx.lineWidth = p.type === "ping" ? 1.5 : 1;
        ctx.stroke(); ctx.closePath();
    });

    enemies.forEach(enemy => {
        if (enemy.opacity > 0) {
            ctx.save(); ctx.translate(enemy.x, enemy.y); ctx.rotate(enemy.angle);
            ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, -8); ctx.lineTo(-8, 8); ctx.closePath();
            ctx.shadowBlur = 10; ctx.shadowColor = `rgba(255, 51, 51, ${enemy.opacity})`;
            ctx.fillStyle = `rgba(255, 51, 51, ${enemy.opacity})`; ctx.fill(); ctx.restore(); ctx.shadowBlur = 0;
        }
    });

    if (!gameRunning) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.8)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = "bold 30px Arial"; ctx.textAlign = "center";
        ctx.fillStyle = win ? "#00ffcc" : "#ff3333";
        ctx.fillText(win ? "BẠN ĐÃ THOÁT THÀNH CÔNG!" : "BẠN ĐÃ BỊ BẮT!", canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = "18px Arial"; ctx.fillStyle = "#ffffff";
        ctx.fillText("Chạm màn hình/Click để chơi lại", canvas.width / 2, canvas.height / 2 + 30);
    }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>

</body>
  </html>
