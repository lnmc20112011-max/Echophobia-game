<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Echo-Phobia: Ám Ảnh Tiếng Vang (Hardcore)</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            margin: 0; padding: 0; background-color: #000; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s ease;
        }
        .welcome-text {
            font-size: 24px; color: #00ffcc; margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0,255,204,0.5); text-align: center; padding: 0 20px;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #333;
            border-top: 5px solid #00ffcc; border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        h2 { margin: 5px 0; color: #ff3333; text-shadow: 0 0 10px rgba(255,51,51,0.5); font-size: 20px; }
        
        #canvas-container { position: relative; width: 100%; max-width: 800px; aspect-ratio: 4/3; }
        canvas { width: 100%; height: 100%; background-color: #000; border: 2px solid #551111; }
        
        #instructions { margin-top: 5px; text-align: center; max-width: 800px; font-size: 12px; color: #888; padding: 0 10px; }
        .highlight { color: #00ffcc; font-weight: bold; }
        .danger { color: #ff3333; font-weight: bold; }
        .item-hl { color: #00a2ff; font-weight: bold; }

        #mobile-controls {
            display: none; width: 100%; max-width: 400px; margin-top: 15px;
            justify-content: space-between; align-items: center; padding: 0 20px;
        }
        .d-pad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px; }
        .btn {
            background: rgba(255,255,255,0.05); border: 2px solid #ff3333; color: #ff3333;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; touch-action: none;
        }
        .btn:active { background: rgba(255, 51, 51, 0.4); }
        .action-buttons { display: flex; flex-direction: column; gap: 10px; }
        .btn-action { width: 90px; height: 45px; font-size: 14px; }
        
        @media (max-width: 768px) { #mobile-controls { display: flex; } #instructions { display: none; } }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="welcome-text">Chào mừng bạn đến với website của cuongdz 😎</div>
        <div class="spinner"></div>
    </div>

    <h2>ECHO-PHOBIA: HARDCORE</h2>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    
    <div id="instructions">
        Di chuyển: <span class="highlight">WASD</span> (<span class="highlight">Shift</span> đi rón rén) | <span class="danger">CẢNH BÁO:</span> PING sẽ báo động <span class="danger">TẤT CẢ KẺ ĐỊCH</span> lao tới bạn!
        <br>Hãy dùng <span class="item-hl">Hộp Radar (Xanh dương)</span> một cách khôn ngoan để dò đường tìm Đích ẩn!
    </div>

    <div id="mobile-controls">
        <div class="d-pad">
            <div></div><div class="btn" id="btn-up">▲</div><div></div>
            <div class="btn" id="btn-left">◀</div><div></div><div class="btn" id="btn-right">▶</div>
            <div></div><div class="btn" id="btn-down">▼</div><div></div>
        </div>
        <div class="action-buttons">
            <div class="btn btn-action" id="btn-ping" style="border-color:#00ffcc; color:#00ffcc;">🔊 PING</div>
            <div class="btn btn-action" id="btn-sneak" style="border-color: #ffcc00; color: #ffcc00;">👟 CHẠY</div>
        </div>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

window.addEventListener("load", () => {
    setTimeout(() => {
        const loader = document.getElementById("loading-screen");
        loader.style.opacity = 0;
        setTimeout(() => loader.style.display = "none", 500);
    }, 2000);
});

let gameRunning = true;
let win = false;

// CÂN BẰNG TỐC ĐỘ: Người chơi đi siêu chậm (Chạy: 1.5, Rón rén: 0.6)
const player = { x: 40, y: 40, radius: 7, speed: 1.5, color: "#00ffcc" };
const goal = { x: 750, y: 550, radius: 15, color: "#ffff00", opacity: 0 };
const radarItem = { x: 0, y: 0, size: 14, color: "#00a2ff", opacity: 0, active: true };

const keys = {};
let touchMovement = { up: false, down: false, left: false, right: false };
let isSneaking = true; // Mặc định mobile cho đi chậm để an toàn

window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

let walls = [];
let enemies = [];
const pings = [];

function generateRandomMap() {
    walls = [
        {x: 0, y: 0, w: 800, h: 10, opacity: 0}, {x: 0, y: 0, w: 10, h: 600, opacity: 0},
        {x: 0, y: 590, w: 800, h: 10, opacity: 0}, {x: 790, y: 0, w: 10, h: 600, opacity: 0}
    ];

    // Tạo bản đồ dạng tổ ong ngóc ngách hơn
    const columns = 8;
    const rows = 6;
    const cellWidth = 720 / columns;
    const cellHeight = 520 / rows;

    for (let c = 0; c < columns; c++) {
        for (let r = 0; r < rows; r++) {
            if (c <= 1 && r <= 1) continue;

            if (Math.random() < 0.70) { // Tăng mật độ tường lên 70%
                let w = Math.random() < 0.5 ? 20 : cellWidth * 0.7;
                let h = w === 20 ? cellHeight * 0.7 : 20;
                let x = 60 + c * cellWidth + Math.random() * (cellWidth - w);
                let y = 60 + r * cellHeight + Math.random() * (cellHeight - h);
                
                if (x > 720 && y > 500) continue;
                walls.push({ x: x, y: y, w: w, h: h, opacity: 0 });
            }
        }
    }

    // Đích ẩn hoàn toàn ở vùng sâu
    goal.x = 550 + Math.random() * 200;
    goal.y = 200 + Math.random() * 350;
    goal.opacity = 0;

    radarItem.x = 300 + Math.random() * 200;
    radarItem.y = 200 + Math.random() * 200;
    radarItem.opacity = 0;
    radarItem.active = true;

    // NÂNG CẤP ĐỐI THỦ: 4 Quái hung hãn, tốc độ săn mồi cực nhanh (2.3)
    enemies = [
        { x: 250, y: 300, targetX: 250, targetY: 300, state: "patrol", speed: 1.1, angle: 0, opacity: 0, timer: 0 },
        { x: 450, y: 150, targetX: 450, targetY: 150, state: "patrol", speed: 1.2, angle: 0, opacity: 0, timer: 0 },
        { x: 600, y: 450, targetX: 600, targetY: 450, state: "patrol", speed: 1.1, angle: 0, opacity: 0, timer: 0 },
        { x: 700, y: 200, targetX: 700, targetY: 200, state: "patrol", speed: 1.3, angle: 0, opacity: 0, timer: 0 }
    ];
}

function triggerPing(targetX, targetY, customRadius = 260, isRadar = false) {
    if (!gameRunning) { resetGame(); return; }
    const angle = Math.atan2(targetY - player.y, targetX - player.x);
    
    pings.push({ 
        x: isRadar ? targetX : player.x, y: isRadar ? targetY : player.y, 
        radius: 5, maxRadius: customRadius, speed: isRadar ? 15 : 5, 
        angle: angle, type: isRadar ? "radar" : "ping" 
    });

    // CƠ CHẾ PACK HUNTING: Nếu dùng PING, TẤT CẢ quái trên bản đồ lập tức biết vị trí và săn lùng bạn!
    if (!isRadar) {
        enemies.forEach(enemy => {
            enemy.state = "chase"; 
            enemy.targetX = player.x; 
            enemy.targetY = player.y;
        });
    }
}

canvas.addEventListener("mousedown", (e) => {
    const rect = canvas.getBoundingClientRect();
    triggerPing(((e.clientX - rect.left) / rect.width) * 800, ((e.clientY - rect.top) / rect.height) * 600);
});

canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    triggerPing(((touch.clientX - rect.left) / rect.width) * 800, ((touch.clientY - rect.top) / rect.height) * 600);
});

const setupMobileBtn = (id, direction) => {
    const btn = document.getElementById(id);
    btn.addEventListener("touchstart", (e) => { e.preventDefault(); touchMovement[direction] = true; });
    btn.addEventListener("touchend", (e) => { e.preventDefault(); touchMovement[direction] = false; });
};
setupMobileBtn("btn-up", "up"); setupMobileBtn("btn-down", "down");
setupMobileBtn("btn-left", "left"); setupMobileBtn("btn-right", "right");

document.getElementById("btn-ping").addEventListener("touchstart", (e) => {
    e.preventDefault(); triggerPing(player.x + 10, player.y);
});

const sneakBtn = document.getElementById("btn-sneak");
// Mặc định ban đầu mobile là đi lặng để an toàn
sneakBtn.textContent = "👣 LẶNG";
sneakBtn.style.borderColor = "#00ffcc";
sneakBtn.style.color = "#00ffcc";

sneakBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    isSneaking = !isSneaking;
    if (isSneaking) {
        sneakBtn.textContent = "👣 LẶNG"; sneakBtn.style.borderColor = "#00ffcc"; sneakBtn.style.color = "#00ffcc";
    } else {
        sneakBtn.textContent = "👟 CHẠY"; sneakBtn.style.borderColor = "#ffcc00"; sneakBtn.style.color = "#ffcc00";
    }
});

function resetGame() {
    player.x = 40; player.y = 40; pings.length = 0;
    generateRandomMap(); gameRunning = true; win = false;
}

function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
function checkCollision(circle, rect) {
    const closestX = clamp(circle.x, rect.x, rect.x + rect.w);
    const closestY = clamp(circle.y, rect.y, rect.y + rect.h);
    return (circle.x - closestX)**2 + (circle.y - closestY)**2 < circle.radius**2;
}

function update() {
    if (!gameRunning) return;

    let moveSpeed = player.speed;
    let sneakActive = keys["ShiftLeft"] || keys["ShiftRight"] || isSneaking;
    if (sneakActive) moveSpeed = 0.6; // Đi rón rén siêu chậm để ẩn mình

    let nextX = player.x; let nextY = player.y; let isMoving = false;

    if (keys["KeyW"] || keys["ArrowUp"] || touchMovement.up) { nextY -= moveSpeed; isMoving = true; }
    if (keys["KeyS"] || keys["ArrowDown"] || touchMovement.down) { nextY += moveSpeed; isMoving = true; }
    if (keys["KeyA"] || keys["ArrowLeft"] || touchMovement.left) { nextX -= moveSpeed; isMoving = true; }
    if (keys["KeyD"] || keys["ArrowRight"] || touchMovement.right) { nextX += moveSpeed; isMoving = true; }

    const tempPlayerX = { x: nextX, y: player.y, radius: player.radius };
    let collideX = false;
    for (let wall of walls) { if (checkCollision(tempPlayerX, wall)) { collideX = true; break; } }
    if (!collideX) player.x = nextX;

    const tempPlayerY = { x: player.x, y: nextY, radius: player.radius };
    let collideY = false;
    for (let wall of walls) { if (checkCollision(tempPlayerY, wall)) { collideY = true; break; } }
    if (!collideY) player.y = nextY;

    if (radarItem.active && Math.hypot(player.x - radarItem.x, player.y - radarItem.y) < (player.radius + radarItem.size/2)) {
        radarItem.active = false;
        triggerPing(400, 300, 1200, true); // Quét siêu rộng
    }

    // Tiếng bước chân khi chạy nhanh (Bán kính động phát hiện tăng lên 120)
    if (isMoving && !sneakActive && Math.random() < 0.06) {
        pings.push({ x: player.x, y: player.y, radius: 5, maxRadius: 75, speed: 3, type: "step" });
        enemies.forEach(enemy => {
            if (Math.hypot(enemy.x - player.x, enemy.y - player.y) < 120) {
                enemy.state = "chase"; enemy.targetX = player.x; enemy.targetY = player.y;
            }
        });
    }

    for (let i = pings.length - 1; i >= 0; i--) {
        const p = pings[i]; p.radius += p.speed;
        walls.forEach(wall => { if (Math.abs(Math.hypot(p.x - (wall.x + wall.w/2), p.y - (wall.y + wall.h/2)) - p.radius) < 35) wall.opacity = 1.0; });
        enemies.forEach(enemy => { if (Math.abs(Math.hypot(p.x - enemy.x, p.y - enemy.y) - p.radius) < 25) enemy.opacity = 1.0; });
        if (Math.abs(Math.hypot(p.x - goal.x, p.y - goal.y) - p.radius) < 25) goal.opacity = 1.0;
        if (radarItem.active && Math.abs(Math.hypot(p.x - radarItem.x, p.y - radarItem.y) - p.radius) < 25) radarItem.opacity = 1.0;
        if (p.radius >= p.maxRadius) pings.splice(i, 1);
    }

    walls.forEach(w => { if (w.opacity > 0) w.opacity -= 0.008; }); // Tường lâu tối hơn một chút để người chơi dễ nhìn đường
    enemies.forEach(e => { if (e.opacity > 0) e.opacity -= 0.018; });
    if (goal.opacity > 0) goal.opacity -= 0.008;
    if (radarItem.opacity > 0) radarItem.opacity -= 0.008;

    // AI THÔNG MINH HƠN: Khi đi săn mồi (`chase`), quái tăng tốc mạnh (2.3)
    enemies.forEach(enemy => {
        if (enemy.state === "patrol") {
            enemy.timer++;
            if (enemy.timer > 90 || Math.hypot(enemy.x - enemy.targetX, enemy.y - enemy.targetY) < 5) {
                let randAngle = Math.random() * Math.PI * 2;
                enemy.targetX = clamp(enemy.x + Math.cos(randAngle) * 120, 20, 780);
                enemy.targetY = clamp(enemy.y + Math.sin(randAngle) * 120, 20, 580);
                enemy.timer = 0;
            }
            const angle = Math.atan2(enemy.targetY - enemy.y, enemy.targetX - enemy.x);
            enemy.angle = angle; enemy.x += Math.cos(angle) * enemy.speed; enemy.y += Math.sin(angle) * enemy.speed;
        } else if (enemy.state === "chase") {
            const angle = Math.atan2(enemy.targetY - enemy.y, enemy.targetX - enemy.x);
            enemy.angle = angle;
            enemy.x += Math.cos(angle) * 2.3; // Tốc độ rượt đuổi cực kỳ kinh hoàng
            enemy.y += Math.sin(angle) * 2.3;
            if (Math.hypot(enemy.targetX - enemy.x, enemy.targetY - enemy.y) < 5) enemy.state = "patrol";
        }

        if (Math.hypot(player.x - enemy.x, player.y - enemy.y) < (player.radius + 7)) { gameRunning = false; win = false; }
    });

    if (Math.hypot(player.x - goal.x, player.y - goal.y) < (player.radius + goal.radius)) { gameRunning = false; win = true; }
}

function draw() {
    ctx.fillStyle = "#000000"; ctx.fillRect(0, 0, canvas.width, canvas.height);

    walls.forEach(wall => {
        if (wall.opacity > 0) {
            ctx.shadowBlur = 8; ctx.shadowColor = `rgba(0, 255, 204, ${wall.opacity})`;
            ctx.strokeStyle = `rgba(0, 255, 204, ${wall.opacity})`; ctx.lineWidth = 2;
            ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
            ctx.fillStyle = `rgba(0, 255, 204, ${wall.opacity * 0.03})`; ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
        }
    });
    ctx.shadowBlur = 0;

    if (goal.opacity > 0) {
        ctx.beginPath(); ctx.arc(goal.x, goal.y, goal.radius, 0, Math.PI * 2);
        ctx.shadowBlur = 20; ctx.shadowColor = `rgba(255, 255, 0, ${goal.opacity})`;
        ctx.fillStyle = `rgba(255, 255, 0, ${goal.opacity})`; ctx.fill(); ctx.closePath(); ctx.shadowBlur = 0;
    }

    if (radarItem.active && radarItem.opacity > 0) {
        ctx.shadowBlur = 10; ctx.shadowColor = `rgba(0, 162, 255, ${radarItem.opacity})`;
        ctx.fillStyle = `rgba(0, 162, 255, ${radarItem.opacity})`;
        ctx.fillRect(radarItem.x - radarItem.size/2, radarItem.y - radarItem.size/2, radarItem.size, radarItem.size);
        ctx.shadowBlur = 0;
    }

    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = player.color; ctx.shadowBlur = 12; ctx.shadowColor = player.color; ctx.fill(); ctx.closePath(); ctx.shadowBlur = 0;

    pings.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        const alpha = 1 - (p.radius / p.maxRadius);
        if (p.type === "radar") { ctx.strokeStyle = `rgba(0, 162, 255, ${alpha})`; ctx.lineWidth = 3; } 
        else {
            ctx.strokeStyle = p.type === "ping" ? `rgba(0, 255, 204, ${alpha})` : `rgba(255, 255, 255, ${alpha * 0.3})`;
            ctx.lineWidth = p.type === "ping" ? 1.5 : 1;
        }
        ctx.stroke(); ctx.closePath();
    });

    enemies.forEach(enemy => {
        if (enemy.opacity > 0) {
            ctx.save(); ctx.translate(enemy.x, enemy.y); ctx.rotate(enemy.angle);
            ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, -8); ctx.lineTo(-8, 8); ctx.closePath();
            ctx.shadowBlur = 12; ctx.shadowColor = `rgba(255, 51, 51, ${enemy.opacity})`;
            ctx.fillStyle = `rgba(255, 51, 51, ${enemy.opacity})`; ctx.fill(); ctx.restore(); ctx.shadowBlur = 0;
        }
    });

    if (!gameRunning) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.9)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = "bold 26px Arial"; ctx.textAlign = "center";
        ctx.fillStyle = win ? "#00ffcc" : "#ff3333";
        ctx.fillText(win ? "BẠN ĐÃ THOÁT THÀNH CÔNG!" : "BẠN ĐÃ BỊ TÓM GỌN TRONG ĐÊM TỐI!", canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = "16px Arial"; ctx.fillStyle = "#ffffff";
        ctx.fillText("Chạm màn hình/Click để đổi map, thử thách lại", canvas.width / 2, canvas.height / 2 + 30);
    }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
generateRandomMap();
loop();
</script>

</body>
</html>
